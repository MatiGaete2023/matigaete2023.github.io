<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Práctica de preguntas de la Academia Judicial">
  <title>Simulador Academia Judicial</title>
  <style>
    :root { color-scheme: dark; --bg:#101827; --panel:#182338; --text:#eef4ff; --muted:#aebbd1; --accent:#63b3ed; --ok:#68d391; --bad:#fc8181; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font:16px/1.5 system-ui,sans-serif; color:var(--text); background:linear-gradient(145deg,#0d1422,#172640); padding:24px; }
    main { max-width:760px; margin:auto; }
    .panel { background:rgba(24,35,56,.96); border:1px solid #2c3e5e; border-radius:16px; padding:24px; box-shadow:0 12px 36px #0004; }
    h1 { margin-top:0; font-size:clamp(1.5rem,4vw,2.2rem); }
    .toolbar,.stats,.actions { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .toolbar { justify-content:space-between; margin-bottom:20px; }
    select,button { font:inherit; border-radius:10px; border:1px solid #3c5375; padding:10px 14px; }
    select { background:#101a2b; color:var(--text); }
    button { background:#223653; color:var(--text); cursor:pointer; }
    button:hover:not(:disabled),button:focus-visible { border-color:var(--accent); outline:2px solid #63b3ed55; }
    button:disabled { cursor:not-allowed; opacity:.55; }
    .stats { color:var(--muted); justify-content:space-between; margin:10px 0 22px; }
    .materia { color:var(--accent); font-weight:600; }
    #pregunta { font-size:1.3rem; margin:8px 0 18px; }
    #opciones { display:grid; gap:10px; }
    .opcion { width:100%; text-align:left; background:#1d2c46; }
    .opcion.correcta { border-color:var(--ok); background:#1b4439; }
    .opcion.incorrecta { border-color:var(--bad); background:#4a2933; }
    #respuesta { min-height:3.2em; margin:18px 0; }
    .ok { color:var(--ok); } .bad { color:var(--bad); }
    .explicacion { color:var(--muted); margin:.4em 0; }
    #revision { margin-top:24px; border-top:1px solid #314563; padding-top:18px; }
    .error-item { border-left:3px solid var(--bad); padding:8px 12px; margin:12px 0; background:#152137; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-labelledby="titulo">
      <div class="toolbar">
        <h1 id="titulo">Simulador Academia Judicial</h1>
        <label>Materia
          <select id="filtroMateria" aria-label="Filtrar por materia"></select>
        </label>
      </div>
      <div class="stats" aria-live="polite">
        <span id="progreso"></span><span id="puntaje"></span>
      </div>
      <div id="materia" class="materia"></div>
      <div id="pregunta" aria-live="polite"></div>
      <div id="opciones" role="group" aria-label="Alternativas"></div>
      <div id="respuesta" aria-live="assertive"></div>
      <div class="actions">
        <button id="siguiente" type="button" disabled>Siguiente pregunta</button>
        <button id="reiniciar" type="button">Reiniciar sesión</button>
      </div>
      <section id="revision" hidden aria-labelledby="revisionTitulo">
        <h2 id="revisionTitulo">Revisión de errores</h2>
        <div id="errores"></div>
      </section>
    </section>
  </main>
  <script src="preguntas.js"></script>
  <script>
    (() => {
      const STORAGE_KEY = "aj-simulador-sesion-v3";
      const SESSION_SCHEMA_VERSION = 3;
      const banco = preguntas_multiples.slice();
      const preguntasPorId = new Map(banco.map(pregunta => [pregunta.id, pregunta]));
      const huellaBanco = banco.map(pregunta => pregunta.id + ":" + pregunta.version + ":" + pregunta.respuesta).join("|");
      const $ = (id) => document.getElementById(id);

      let preguntasDisponibles = [];
      let preguntaActual = null;
      let puntaje = 0;
      let respondidas = new Map();
      let filtro = "Todas";
      let avisoPendiente = "";

      function guardarSesion() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            schemaVersion: SESSION_SCHEMA_VERSION,
            bankFingerprint: huellaBanco,
            remainingIds: preguntasDisponibles.map(pregunta => pregunta.id),
            currentQuestionId: preguntaActual ? preguntaActual.id : null,
            answers: [...respondidas.entries()],
            filtro
          }));
        } catch (_) { /* almacenamiento no disponible */ }
      }

      function restaurarRespuestas(entradas) {
        const respuestas = new Map();
        entradas.forEach(entrada => {
          if (!Array.isArray(entrada) || entrada.length !== 2) return;
          const [id, dato] = entrada;
          const pregunta = preguntasPorId.get(id);
          if (!pregunta || !dato || !Number.isInteger(dato.seleccionada)) return;
          if (dato.seleccionada < 0 || dato.seleccionada >= pregunta.opciones.length) return;
          respuestas.set(id, {
            seleccionada: dato.seleccionada,
            correcta: dato.seleccionada === pregunta.respuesta,
            respondidaEn: typeof dato.respondidaEn === "string" ? dato.respondidaEn : null
          });
        });
        return respuestas;
      }

      function restaurarSesion() {
        preguntasDisponibles = banco.slice();
        try {
          const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (!data) return;
          if (data.schemaVersion !== SESSION_SCHEMA_VERSION || data.bankFingerprint !== huellaBanco) {
            avisoPendiente = "El banco de preguntas fue actualizado; se inició una nueva sesión para evitar resultados inconsistentes.";
            return;
          }
          if (!Array.isArray(data.answers) || !Array.isArray(data.remainingIds)) return;

          respondidas = restaurarRespuestas(data.answers);
          puntaje = [...respondidas.values()].filter(respuesta => respuesta.correcta).length;
          const restantes = new Set(data.remainingIds.filter(id => preguntasPorId.has(id)));
          preguntasDisponibles = banco.filter(pregunta => restantes.has(pregunta.id));
          if (typeof data.filtro === "string" && materias().includes(data.filtro)) filtro = data.filtro;

          if (typeof data.currentQuestionId === "string" && restantes.has(data.currentQuestionId)) {
            preguntaActual = preguntasPorId.get(data.currentQuestionId) || null;
          }
        } catch (_) {
          avisoPendiente = "No fue posible restaurar la sesión anterior; se inició una nueva.";
          preguntasDisponibles = banco.slice();
          preguntaActual = null;
          puntaje = 0;
          respondidas = new Map();
        }
      }

      function materias() {
        return ["Todas", ...new Set(banco.map(pregunta => pregunta.materia || "Sin materia"))];
      }

      function prepararFiltro() {
        $("filtroMateria").replaceChildren();
        materias().forEach(materia => {
          const option = document.createElement("option");
          option.value = materia;
          option.textContent = materia;
          $("filtroMateria").appendChild(option);
        });
        $("filtroMateria").value = filtro;
        $("filtroMateria").addEventListener("change", () => {
          if (preguntaActual && respondidas.has(preguntaActual.id)) {
            preguntasDisponibles = preguntasDisponibles.filter(pregunta => pregunta.id !== preguntaActual.id);
          }
          preguntaActual = null;
          filtro = $("filtroMateria").value;
          $("revision").hidden = true;
          guardarSesion();
          cargarPregunta(true);
        });
      }

      function listaFiltrada() {
        return preguntasDisponibles.filter(pregunta => filtro === "Todas" || pregunta.materia === filtro);
      }

      function actualizarStats() {
        const preguntasMateria = filtro === "Todas" ? banco : banco.filter(pregunta => pregunta.materia === filtro);
        const hechas = preguntasMateria.filter(pregunta => respondidas.has(pregunta.id)).length;
        const aciertos = preguntasMateria.filter(pregunta => respondidas.get(pregunta.id)?.correcta).length;
        $("progreso").textContent = "Respondidas: " + hechas + "/" + preguntasMateria.length;
        $("puntaje").textContent = filtro === "Todas" ? "Puntaje: " + puntaje : "Aciertos en materia: " + aciertos;
      }

      function mostrarAvisoPendiente() {
        if (!avisoPendiente) return;
        const aviso = document.createElement("p");
        aviso.className = "explicacion";
        aviso.textContent = avisoPendiente;
        $("respuesta").appendChild(aviso);
        avisoPendiente = "";
      }

      function cargarPregunta(cambiarFiltro = false) {
        const candidatas = listaFiltrada();
        if (!candidatas.length) {
          if (preguntasDisponibles.length === 0) return finalizar();
          return finalizarMateria();
        }

        if (cambiarFiltro || !preguntaActual || !candidatas.some(pregunta => pregunta.id === preguntaActual.id)) {
          preguntaActual = candidatas[Math.floor(Math.random() * candidatas.length)];
        }

        $("materia").textContent = preguntaActual.materia || "Sin materia";
        $("pregunta").textContent = preguntaActual.pregunta;
        $("respuesta").replaceChildren();
        $("opciones").replaceChildren();
        $("siguiente").disabled = !respondidas.has(preguntaActual.id);

        preguntaActual.opciones.forEach((texto, index) => {
          const boton = document.createElement("button");
          boton.type = "button";
          boton.className = "opcion";
          boton.textContent = texto;
          boton.setAttribute("aria-label", "Alternativa " + (index + 1) + ": " + texto);
          boton.addEventListener("click", () => verificarRespuesta(index));

          const previa = respondidas.get(preguntaActual.id);
          if (previa) {
            boton.disabled = true;
            if (index === preguntaActual.respuesta) boton.classList.add("correcta");
            if (index === previa.seleccionada && !previa.correcta) boton.classList.add("incorrecta");
          }
          $("opciones").appendChild(boton);
        });

        const previa = respondidas.get(preguntaActual.id);
        if (previa) mostrarResultado(previa.seleccionada);
        mostrarAvisoPendiente();
        actualizarStats();
        guardarSesion();
      }

      function mostrarResultado(seleccionado) {
        const correcta = seleccionado === preguntaActual.respuesta;
        $("respuesta").replaceChildren();

        const titulo = document.createElement("strong");
        titulo.className = correcta ? "ok" : "bad";
        titulo.textContent = correcta ? "✅ Correcto" : "❌ Incorrecto. Respuesta correcta: " + preguntaActual.opciones[preguntaActual.respuesta];
        $("respuesta").appendChild(titulo);

        const explicacion = document.createElement("p");
        explicacion.className = "explicacion";
        explicacion.textContent = preguntaActual.explicacion;
        $("respuesta").appendChild(explicacion);

        const fuente = document.createElement("small");
        fuente.textContent = preguntaActual.fuenteVerificada ? "Fuente verificada: " + preguntaActual.fuente : "Advertencia: " + preguntaActual.fuente;
        $("respuesta").appendChild(fuente);
      }

      function verificarRespuesta(seleccionado) {
        if (!preguntaActual || respondidas.has(preguntaActual.id)) return;

        const correcta = seleccionado === preguntaActual.respuesta;
        respondidas.set(preguntaActual.id, {
          seleccionada: seleccionado,
          correcta,
          respondidaEn: new Date().toISOString()
        });
        puntaje = [...respondidas.values()].filter(respuesta => respuesta.correcta).length;

        mostrarResultado(seleccionado);
        document.querySelectorAll(".opcion").forEach((boton, index) => {
          boton.disabled = true;
          if (index === preguntaActual.respuesta) boton.classList.add("correcta");
          if (index === seleccionado && !correcta) boton.classList.add("incorrecta");
        });
        $("siguiente").disabled = false;
        guardarSesion();
        actualizarStats();
      }

      function siguientePregunta() {
        if (!preguntaActual || !respondidas.has(preguntaActual.id)) return;
        preguntasDisponibles = preguntasDisponibles.filter(pregunta => pregunta.id !== preguntaActual.id);
        preguntaActual = null;
        $("revision").hidden = true;
        guardarSesion();
        cargarPregunta();
      }

      function finalizarMateria() {
        preguntaActual = null;
        $("materia").textContent = "";
        $("pregunta").textContent = "No quedan preguntas sin responder en " + filtro + ".";
        $("opciones").replaceChildren();
        $("respuesta").textContent = "Puedes seleccionar otra materia o reiniciar esta sesión.";
        $("siguiente").disabled = true;
        actualizarStats();
        guardarSesion();
      }

      function finalizar() {
        preguntaActual = null;
        $("pregunta").textContent = "Sesión finalizada.";
        $("materia").textContent = "";
        $("opciones").replaceChildren();
        $("respuesta").textContent = "Resultado: " + puntaje + " acierto(s) de " + respondidas.size + ".";
        $("siguiente").disabled = true;

        const errores = [...respondidas.entries()].filter(([, respuesta]) => !respuesta.correcta);
        $("errores").replaceChildren();
        $("revision").hidden = errores.length === 0;
        errores.forEach(([id, respuesta]) => {
          const pregunta = preguntasPorId.get(id);
          if (!pregunta) return;
          const item = document.createElement("article");
          item.className = "error-item";
          item.textContent = pregunta.pregunta + " · Tu respuesta: " + pregunta.opciones[respuesta.seleccionada] + ". Correcta: " + pregunta.opciones[pregunta.respuesta] + ". " + pregunta.explicacion;
          $("errores").appendChild(item);
        });

        actualizarStats();
        guardarSesion();
      }

      function reiniciarSimulador() {
        puntaje = 0;
        respondidas = new Map();
        preguntasDisponibles = banco.slice();
        preguntaActual = null;
        avisoPendiente = "";
        $("revision").hidden = true;
        guardarSesion();
        cargarPregunta();
      }

      $("siguiente").addEventListener("click", siguientePregunta);
      $("reiniciar").addEventListener("click", reiniciarSimulador);
      restaurarSesion();
      prepararFiltro();
      cargarPregunta();
    })();
  </script>
</body>
</html>
